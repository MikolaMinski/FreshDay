# Автодеплой на GitHub Pages при каждом push в ветку main.
# Настройка: Settings → Pages → Source: «GitHub Actions».
#
# Адрес сайта определяется автоматически:
#  - без своего домена → https://<логин>.github.io/<репозиторий>/
#  - со своим доменом → создайте переменную CUSTOM_DOMAIN (Settings → Secrets and variables →
#    Actions → Variables), например freshday.by, и укажите тот же домен в Settings → Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Определить адрес сайта
        id: addr
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "site=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$owner_lc.github.io" ]; then
            echo "site=https://$owner_lc.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://$owner_lc.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка и загрузка сайта
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          SITE_URL: ${{ steps.addr.outputs.site }}
          BASE_PATH: ${{ steps.addr.outputs.base }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
          PUBLIC_GOOGLE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_VERIFICATION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
