# GitHub Pages: переадресация старого адреса на основной сайт.
#
# Основной сайт живёт на хостинге (https://freshday.by, сборка — hosting.yml).
# Копия на https://mikolaminski.github.io/FreshDay/ раньше была полноценным сайтом, и Google мог
# считать freshday.by её дублем. Теперь каждая страница здесь — мгновенная переадресация
# на ту же страницу основного домена (canonical + meta refresh), чтобы Google перенёс
# индексацию на freshday.by.
#
# Домен берётся из переменной HOSTING_SITE_URL (по умолчанию https://freshday.by).
name: Deploy to GitHub Pages (redirect)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAIN_SITE: ${{ vars.HOSTING_SITE_URL || 'https://freshday.by' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка (только чтобы получить список страниц)
        run: npm run build
        env:
          SITE_URL: ${{ env.MAIN_SITE }}
          BASE_PATH: /

      - name: Страницы-переадресации на основной домен
        run: node scripts/pages-redirect.mjs dist pages-out "$MAIN_SITE"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
