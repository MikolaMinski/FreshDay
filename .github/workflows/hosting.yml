# Сборка для хостинга с Plesk (hoster.by и т. п.) при каждом push в main.
#
# Результат кладётся в ветки репозитория, откуда Plesk забирает его через «Развернуть с помощью Git»:
#   hosting      — готовый сайт (содержимое папки dist) → в httpdocs основного домена;
#   hosting-api  — собранный сервис заявок .NET (server/, автономный win-x86) → в папку поддомена api.
# Пошаговая настройка Plesk — docs/HOSTING.md.
#
# Переменные (Settings → Secrets and variables → Actions → Variables):
#   HOSTING_SITE_URL      адрес сайта на хостинге, например https://freshday.by
#   HOSTING_LEAD_API_URL  адрес сервиса заявок; по умолчанию https://api.freshday.by/api/lead
#                         (сервис .NET 10 из server/). Значение «-» — форма шлёт в api/lead.php (PHP).
name: Build for Plesk hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosting
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка сайта
        run: npm run build
        env:
          SITE_URL: ${{ vars.HOSTING_SITE_URL }}
          BASE_PATH: /
          # Сервис заявок на .NET 10 (server/) на поддомене api. Переопределить — переменная HOSTING_LEAD_API_URL.
          PUBLIC_LEAD_API_URL: ${{ vars.HOSTING_LEAD_API_URL || 'https://api.freshday.by/api/lead' }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
          PUBLIC_GOOGLE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_VERIFICATION }}

      - name: Опубликовать в ветку hosting
        run: bash .github/scripts/publish-branch.sh hosting dist
        env:
          GH_TOKEN: ${{ github.token }}

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: server/global.json

      - name: Сборка сервиса
        run: |
          # Автономная сборка под Windows (IIS): .NET 10 едет вместе с сервисом,
          # на сервере нужен только модуль ASP.NET Core для IIS.
          # win-x86: пулы приложений на hoster.by 32-битные (иначе HTTP 500.32).
          dotnet publish server/src/FreshDay.LeadBot -c Release -r win-x86 --self-contained true -o api-out
          mkdir -p api-out/data
          touch api-out/data/.keep

      - name: Опубликовать в ветку hosting-api
        run: bash .github/scripts/publish-branch.sh hosting-api api-out
        env:
          GH_TOKEN: ${{ github.token }}
